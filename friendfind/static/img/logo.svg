<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FriendFind spyglass logo">
  <!-- Spyglass-with-heart mark, matching Nova's reference shape: round lens
       with a big heart, straight notched handle to the lower right —
       recolored in the app's pink/purple palette with small sparkles. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f48fb9"/>
      <stop offset="1" stop-color="#8d6cb8"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="17.5" fill="#fff5fa"/>
  <circle cx="24" cy="24" r="17.5" fill="none" stroke="url(#ring)" stroke-width="5.5"/>
  <path d="M24 36 C 16 30, 11.5 25, 11.5 19.5 C 11.5 15, 15 12.5, 18.5 12.5
           C 21 12.5, 23 14, 24 16 C 25 14, 27 12.5, 29.5 12.5
           C 33 12.5, 36.5 15, 36.5 19.5 C 36.5 25, 32 30, 24 36 Z"
        fill="#ec6ba4"/>
  <g transform="rotate(-45 24 24)">
    <!-- short connector from the ring, then a notch, then the main handle -->
    <rect x="21.5" y="43" width="5" height="8" fill="#8d6cb8"/>
    <rect x="20" y="53" width="8" height="24" rx="4" fill="#8d6cb8"/>
  </g>
  <!-- little sparkles -->
  <path d="M55 6c.5 2.6 1.6 3.7 4.2 4.2-2.6.5-3.7 1.6-4.2 4.2-.5-2.6-1.6-3.7-4.2-4.2 2.6-.5 3.7-1.6 4.2-4.2Z" fill="#f48fb9"/>
  <path d="M8 47c.4 2.1 1.3 3 3.4 3.4-2.1.4-3 1.3-3.4 3.4-.4-2.1-1.3-3-3.4-3.4 2.1-.4 3-1.3 3.4-3.4Z" fill="#cbb3e6"/>
</svg>
