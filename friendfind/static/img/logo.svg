<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FriendFind spyglass logo">
  <!-- Interim original spyglass-with-heart mark, drawn to match the app's
       aesthetic. Replace this file (or point base.html at logo.png) with
       Nova's final artwork for the real logo. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f48fb9"/>
      <stop offset="1" stop-color="#b985f0"/>
    </linearGradient>
  </defs>
  <!-- handle -->
  <g transform="rotate(45 44 44)">
    <rect x="40.5" y="40" width="7" height="19" rx="3.5" fill="url(#ring)"/>
    <rect x="39" y="55" width="10" height="7" rx="3.5" fill="#8d6cb8"/>
  </g>
  <!-- lens ring -->
  <circle cx="27" cy="27" r="19" fill="none" stroke="url(#ring)" stroke-width="7"/>
  <circle cx="27" cy="27" r="15.5" fill="#fff5fa"/>
  <!-- heart inside the lens -->
  <path d="M27 36.5s-9-5.7-9-11.6c0-3 2.4-5 4.9-5 1.7 0 3.2.9 4.1 2.2.9-1.3 2.4-2.2 4.1-2.2 2.5 0 4.9 2 4.9 5 0 5.9-9 11.6-9 11.6Z" fill="#ec6ba4"/>
  <circle cx="23.4" cy="23.6" r="1.2" fill="#ffffff"/>
  <!-- glass glint + sparkle -->
  <path d="M18.5 20.5a10.5 10.5 0 0 1 5-4.6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".85"/>
  <path d="M52 10c.5 2.8 1.7 4 4.5 4.5-2.8.5-4 1.7-4.5 4.5-.5-2.8-1.7-4-4.5-4.5 2.8-.5 4-1.7 4.5-4.5Z" fill="#f48fb9"/>
  <path d="M9 47c.4 2.2 1.3 3.1 3.5 3.5-2.2.4-3.1 1.3-3.5 3.5-.4-2.2-1.3-3.1-3.5-3.5 2.2-.4 3.1-1.3 3.5-3.5Z" fill="#cbb3e6"/>
</svg>
