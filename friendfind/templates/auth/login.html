{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card card-narrow">
  <div class="brand-block">
    <img class="brand-logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="FriendFind logo">
    <h1>FriendFind</h1>
    <p class="tagline">One account banned shouldn't mean one friend lost.</p>
  </div>
  <form method="post">
    <label>Email <input type="email" name="email" required autofocus></label>
    <label>Password <input type="password" name="password" required></label>
    <button class="btn btn-primary sparkle-hover" type="submit">Log in ✨</button>
  </form>
  <p class="hint"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p>
</div>

<div class="card card-narrow invite-choice">
  <p class="invite-choice-lede">New here? This is a private, vetted group.</p>
  <div class="invite-options">
    <span class="invite-option">💌 Get an invite link from a member</span>
    <span class="invite-or">or</span>
    <a class="btn btn-primary sparkle-hover" href="{{ url_for('auth.request_invite') }}">Request an invite ✨</a>
  </div>
</div>
{% endblock %}
